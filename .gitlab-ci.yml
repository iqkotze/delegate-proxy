# Every job runs ci/jobs/<job>.sh, which behaves the same locally.
include:
  - local: ci/runner-tags.yml
    rules:
      - if: $DG_RUNNER_TAG

stages: [build, test, sanitize, analyze, coverage, fuzz, load, docs, docker]

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "schedule"

default:
  image: debian:trixie
  interruptible: true

variables:
  DEBIAN_FRONTEND: noninteractive
  GIT_DEPTH: "1"
  CCACHE_DIR: $CI_PROJECT_DIR/.ccache
  CCACHE_MAXSIZE: 1G
  FUZZ_SECONDS: "60"

.cache: &cache
  key: dg-$CI_JOB_NAME
  paths: [.apt-cache/, .ccache/]

.job:
  cache: *cache
  script: [ci/jobs/$CI_JOB_NAME.sh]

.build:
  extends: .job
  stage: build
  artifacts:
    expire_in: 1 day
    paths: [build/debug/]
    exclude: [build/**/*.o, build/**/*.a]

.test:
  extends: .job
  stage: test
  needs: [build-trixie-gcc]
  artifacts:
    when: always
    expire_in: 1 week
    paths: [build/debug/Testing/]
    reports:
      junit: build/debug/junit-*.xml

build-trixie-gcc:
  extends: .build

build-testing-gcc:
  extends: .job
  stage: build
  image: debian:testing

build-trixie-clang:
  extends: .job
  stage: build

build-release:
  extends: .job
  stage: build

build-cxx23:
  extends: .job
  stage: build

unit:
  extends: .test

tls:
  extends: .test

smoke:
  extends: .test

param-check:
  extends: .test

asan-ubsan:
  extends: .job
  stage: sanitize
  artifacts:
    when: always
    expire_in: 1 week
    paths: [build/asan/Testing/]
    reports:
      junit: build/asan/junit-asan.xml

clang-tidy:
  extends: .job
  stage: analyze
  artifacts:
    when: always
    expire_in: 1 week
    paths: [build/analyze/clang-tidy.txt]
    reports:
      codequality: build/analyze/clang-tidy-codequality.json

cppcheck:
  extends: .job
  stage: analyze
  artifacts:
    when: always
    expire_in: 1 week
    paths: [build/analyze/cppcheck.txt]
    reports:
      codequality: build/analyze/cppcheck-codequality.json

param-docs-current:
  extends: .job
  stage: analyze

warnings:
  extends: .job
  stage: analyze
  artifacts:
    when: always
    expire_in: 1 week
    paths: [build/warnings/build.log]

coverage:
  extends: .job
  stage: coverage
  coverage: '/^lines:\s*(\d+(?:\.\d+)?)%/'
  artifacts:
    when: always
    expire_in: 1 week
    paths: [build/coverage/report/]
    reports:
      coverage_report:
        coverage_format: cobertura
        path: build/coverage/report/cobertura.xml
      junit: build/coverage/junit-*.xml

fuzz:
  extends: .job
  stage: fuzz
  # Known crashes in tests/fuzz/crashes keep this job red until they are fixed
  allow_failure: true
  variables:
    FUZZ_WORK: $CI_PROJECT_DIR/fuzz-work
  cache:
    - *cache
    - key: fuzz-corpus-$CI_COMMIT_REF_SLUG
      paths: [fuzz-work/corpus/]
  artifacts:
    when: always
    expire_in: 1 week
    paths: [fuzz-work/crashes/, fuzz-work/*.log]
    reports:
      junit: build/fuzz/junit-fuzz-regress.xml
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" || $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - when: manual
      allow_failure: true

load:
  extends: .job
  stage: load
  timeout: 1h
  artifacts:
    when: always
    expire_in: 1 week
    paths: [build/release-load/Testing/]
    reports:
      junit: build/release-load/junit-load.xml
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - when: manual
      allow_failure: true

docs:
  extends: .job
  stage: docs
  artifacts:
    expire_in: 1 week
    paths: [build/debug/docs/html/]

pages:
  extends: .job
  stage: docs
  artifacts:
    paths: [public]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

docker:
  stage: docker
  image: docker:27
  services: [docker:27-dind]
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: /certs
    DOCKER_TLS_VERIFY: "1"
    DOCKER_CERT_PATH: /certs/client
  script: [ci/jobs/docker.sh]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - when: manual
      allow_failure: true
